name: Deploy Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.release.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Patch
        env:
          AC3E2F: ${{ secrets.AC3E2F }}
          B1D6DB: ${{ secrets.B1D6DB }}
        run: |
          python3 -c "
          import os, pathlib, sys
          k1 = os.environ.get('AC3E2F', '')
          k2 = os.environ.get('B1D6DB', '')
          idx = pathlib.Path('index.html')
          txt = idx.read_text(encoding='utf-8')
          out = txt.replace('<!-- c8cd52f556a1684cf2977259bec3b53a2ae56fbc -->', k1) if k1 else txt
          out = out.replace('<!-- 26c9554d561c9c460a13264fec5659d933afec6b9a85 -->', k2) if k2 else out
          if out == txt and (k1 or k2):
              sys.exit(1)
          if out != txt:
              idx.write_text(out, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: release
        uses: actions/deploy-pages@v4
